# This is a basic workflow to help you get started with Actions

name: test_workflow

# Controls when the workflow will run
# When to run it
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # push:
  # schedule:
  #   - cron: '*/5 0 * * * *'  # runs every 5 minutes, all day 
  workflow_dispatch: # manual button,  disable push and schedule to use this

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# What to run
jobs:
  # This workflow contains a single job called "build", I renamed "build_Job"
  build_job:      # remember to set the job name here or below with name: build_job
    # The type of runner that the job will run on 
    # <ctrl> + <space> to see the list of available runners
    runs-on: ubuntu-latest
    #runs-on: macos-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # - uses: actions/checkout@v4 # v4 is NodeJs v20,  v6 is NodeJS v24
      - run: pwd && ls -all         #step
      - uses: actions/checkout@v6   #step
      # - uses: actions/setup-node@v3 #step  will install node @v3
      - run: pwd && ls -all

      # Runs a single command using the runners shell
      - name: Step Run a one-line script
        run: sleep 5

      # Runs a set of commands using the runners shell, Multi-line script "|"
      - name: Step Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
